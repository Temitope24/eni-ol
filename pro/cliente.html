-->

<script src="../assets/js/motion.js"></script>
<style>
  body { line-height: normal; }
  .cl-header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  .cl-header a.back { font-size: 18px; color: var(--ink); text-decoration: none; }
  .cl-header p { margin: 0; font-size: 15px; font-weight: 600; }
  .cl-main { padding: 18px 20px 60px; max-width: 560px; margin: 0 auto; }

  .cl-top { display: flex; gap: 14px; align-items: center; }
  .cl-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--sand); border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 22px; flex: none; }
  .cl-name { margin: 0; font-family: var(--font-display); font-size: 24px; }
  .cl-meta { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .cl-actions { display: flex; gap: 8px; margin: 14px 0 16px; }
  .cl-actions .btn { flex: 1; padding: 13px 8px; }

  .cl-section { margin-bottom: 18px; }
  .cl-eyebrow { margin: 0 0 8px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-3); }
  .cl-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-card); padding: 12px; font-size: 14px; }
  .cl-card p { margin: 0; }
  .cl-kv { display: flex; justify-content: space-between; gap: 8px; }
  .cl-kv + .cl-kv { margin-top: 6px; }
  .cl-kv .k { color: var(--ink-2); }

  .cl-wig-card { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-card); padding: 12px; }
  .cl-wig-thumb { width: 64px; height: 80px; border-radius: 8px; border: 1px solid var(--rule); flex: none; }
  .cl-wig-list { display: flex; flex-direction: column; gap: 10px; }

  .cl-gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cl-gallery__add { aspect-ratio: 4/5; border-radius: 8px; background: var(--sand); border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--ink-2); cursor: default; }

  .cl-hist-row { padding: 12px; border-bottom: 1px solid var(--sand); display: flex; justify-content: space-between; text-decoration: none; color: inherit; font-size: 14px; }
  .cl-hist-row:last-child { border-bottom: 0; }

  .cl-note { background: var(--sand); border-radius: var(--radius-card); padding: 12px; font-size: 14px; }
  .cl-note p:first-child { margin: 0; color: #3A2A1E; }
  .cl-note p:last-child { margin: 6px 0 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
</style>
</head>
<body>
