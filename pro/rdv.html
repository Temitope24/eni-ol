<style>
  body { line-height: normal; }
  .rdv-header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  .rdv-header a.back { font-size: 18px; color: var(--ink); text-decoration: none; }
  .rdv-header p { margin: 0; font-size: 15px; font-weight: 600; }
  .rdv-main { padding: 18px 20px 100px; max-width: 560px; margin: 0 auto; }
  @media (min-width: 900px) { .rdv-main { padding: 32px 20px 60px; } }

  .rdv-name { margin: 12px 0 2px; font-size: 26px; }
  .rdv-service { margin: 0 0 2px; font-size: 15px; }
  .rdv-when { margin: 0 0 16px; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); }
  .rdv-actions { display: flex; gap: 8px; margin-bottom: 18px; }
  .rdv-actions .btn { flex: 1; padding: 14px 8px; }

  .rdv-eyebrow { margin: 0 0 8px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-3); }
  .rdv-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-card); padding: 14px; margin-bottom: 18px; font-size: 14.5px; }
  .rdv-card p { margin: 0; }
  .rdv-card p + p { margin-top: 4px; }
  .rdv-quote { font-style: italic; color: var(--ink-body); }

  .rdv-photos { display: flex; gap: 8px; margin-bottom: 8px; }
  .rdv-photo { width: 72px; height: 72px; border-radius: 10px; border: 1px solid var(--rule); }

  .rdv-payment-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .rdv-payment-row.total { margin-top: 10px; font-weight: 600; font-size: 16px; border-top: 1px solid var(--sand); padding-top: 10px; }
  .rdv-payment-row .muted { color: var(--ink-2); }

  .rdv-final-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .rdv-warning { margin: 10px 0 0; font-size: 12.5px; color: var(--state-danger-ink); }
</style>
</head>
<body>
