<!doctype html>
<!--
  pro/encaissements.html — batch B32. Source: PRO R10, read in full. CSV
  columns from DATA-MODEL.md §6: "Date d'encaissement; Cliente; Prestation;
  Type; Moyen; Montant (€); Réf. RDV" — the mandatory livre des recettes
  fields (date, client, nature, amount, method). Per data.js's own header
  note (discrepancy #4), the summary tiles below are computed from the
  itemized payments array, not reproduced from R10's own tile numbers,
  since those don't sum to match R10's itemized list either.
-->
<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../assets/css/pro-motion-off.css">
<script src="../assets/js/motion.js"></script>
<style>
  body { line-height: normal; }
  .pro-page__main { padding: 18px 20px 100px; max-width: 620px; }
  @media (min-width: 900px) { .pro-page__main { padding: 26px 32px 40px; } }
  h1.page-title { font-size: 26px; margin: 0 0 4px; }
  .enc-sub { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-2); }
  .enc-month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .enc-month-nav button { background: none; border: 0; font-size: 18px; color: var(--ink-3); cursor: pointer; }
  .enc-month-nav span.label { font-family: var(--font-mono); font-size: 15px; }

  .enc-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .enc-tile { border-radius: var(--radius-card); padding: 14px; }
  .enc-tile--dark { background: var(--deep); color: var(--ink-on-deep); }
  .enc-tile--light { background: var(--surface); border: 1px solid var(--rule); }
  .enc-tile--warn { background: var(--state-warn-bg); }
  .enc-tile p { margin: 0; }
  .enc-tile__eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; }
  .enc-tile__value { font-family: var(--font-mono); font-size: 24px; margin-top: 6px !important; }

  .enc-table-head { display: flex; gap: 8px; padding: 10px 12px; background: var(--sand); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: #5A4939; }
  .enc-row { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--sand); align-items: flex-start; font-size: 13.5px; }
  .enc-row:last-child { border-bottom: 0; }
</style>
</head>
<body>

  <main class="pro-page__main">

    <p class="enc-sub">Ton livre des recettes — date, cliente, prestation, moyen, montant.</p>
    <div class="enc-month-nav">
      <button type="button" id="enc-prev" aria-label="Mois précédent">‹</button>
      <span class="label" id="enc-month-label"></span>
      <button type="button" id="enc-next" aria-label="Mois suivant">›</button>
      <button type="button" class="btn btn--secondary" id="enc-export" style="margin-left:auto; padding:12px 14px; min-height:0;">Exporter (CSV)</button>
    </div>
    <div class="enc-tiles" id="enc-tiles"></div>
    <div class="data-table"><div class="enc-table-head"><span style="width:52px;">DATE</span><span style="flex:1;">CLIENTE</span><span style="width:64px;">MOYEN</span><span style="width:60px; text-align:right;">MONTANT</span></div><div id="enc-rows"></div></div>
