<!doctype html>
<!--
  pro/demandes.html — batch B24. Source: PRO R02 (all 4 request-card
  variants: OK, Ne tient pas, Loin, Projet) read in full, R03 (Accepter
  sheet) read in full, COMP's own request-card/sheet sections cross-checked.
  Same "no desktop artboard" situation as B23 — sidebar shell extrapolated
  from R12/R13/R14-desktop, content column just widens.

  Only R02's "À valider" tab is pixel-drawn. The other three tabs (À venir/
  Passés/Annulés) have no artboard at all — extrapolated as compact rows
  using the shared .data-table pattern from R13, flagged here rather than
  invented silently. The Proposer-un-autre-créneau and "Préparer le devis"
  sheets likewise have no dedicated artboard (R03 only covers Accepter) —
  built as minimal, real sheets in the same visual language, not full
  bespoke designs.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demandes — Eni’ol</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/motion.css">
<link rel="stylesheet" href="../assets/css/pro-motion-off.css">
<script src="../assets/js/motion.js"></script>
<style>
  body { line-height: normal; }
  .pro-page__main { padding: 18px 20px 100px; max-width: 640px; }
  @media (min-width: 900px) { .pro-page__main { padding: 26px 32px 40px; max-width: 760px; } }

  h1.page-title { font-size: 26px; margin: 0 0 12px; }
  .req-tabs { position: relative; display: flex; gap: 6px; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
  /* font-weight is 600 at ALL times (not just when active) — toggling it
     between 400/600 changes each label's own measured width, which
     reflows every tab to its right. A ::before trick to "reserve" the
     bold width was tried and made it worse (it became a real flex item
     and broke the row). Keeping the weight constant and using colour +
     the sliding underline for the active state is the simple version
     that genuinely can't reflow anything. */
  .req-tabs button {
    position: relative; flex: 0 0 auto; white-space: nowrap;
    padding: 12px 4px; font-size: 14px; font-weight: 600; color: var(--ink-2); background: none; border: 0;
    cursor: pointer; display: flex; align-items: center; gap: 6px; margin-right: 12px;
  }
  .req-tabs button:last-child { margin-right: 0; }
  .req-tabs button.is-active { color: var(--ink); }
  .req-tabs__underline {
    position: absolute; bottom: -1px; left: 0; height: 2px; background: var(--action);
    transition: transform 260ms cubic-bezier(.3,.8,.25,1), width 260ms cubic-bezier(.3,.8,.25,1);
  }
  .req-tabs__count { background: var(--state-danger-ink); color: var(--surface); border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; }
  .req-list { display: flex; flex-direction: column; gap: 14px; }

  .req-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-card); text-decoration: none; color: inherit; }
  .req-row__name { margin: 0; font-weight: 600; font-size: 15px; }
  .req-row__sub { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>

<div class="pro-page">
  <nav class="pro-sidebar" aria-label="Navigation Eni’ol">
    <p class="pro-sidebar__logo">Eni’ol</p>
    <a class="pro-sidebar__item" href="index.html">☀ Aujourd’hui</a>
    <a class="pro-sidebar__item is-active" href="demandes.html">✉ Demandes <span class="pro-sidebar__badge" data-badge="demandes" hidden></span></a>
    <a class="pro-sidebar__item" href="agenda.html">▦ Agenda</a>
    <a class="pro-sidebar__item" href="clientes.html">♡ Clientes</a>
    <a class="pro-sidebar__item" href="prestations.html">✂ Prestations</a>

    <a class="pro-sidebar__item" href="encaissements.html">€ Encaissements</a>
    <a class="pro-sidebar__item" href="reglages.html">⚙ Réglages</a>
  </nav>

  <main class="pro-page__main">
    <h1 class="page-title">Demandes</h1>
    <div class="req-tabs" role="tablist" id="req-tabs">
      <span class="req-tabs__underline" id="req-tabs-underline"></span>
      <button type="button" role="tab" data-tab="valider" data-label="À valider" class="is-active">À valider <span class="req-tabs__count" data-badge="demandes" hidden></span></button>
      <button type="button" role="tab" data-tab="venir" data-label="À venir">À venir</button>
      <button type="button" role="tab" data-tab="passes" data-label="Passés">Passés</button>
      <button type="button" role="tab" data-tab="annules" data-label="Annulés">Annulés</button>
    </div>
    <div class="req-list" id="req-list"></div>
  </main>
</div>

<nav class="bottom-nav" aria-label="Navigation Eni’ol" style="position:fixed; left:0; right:0; bottom:0; z-index:10;">

</html>
